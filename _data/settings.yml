statement_title: "Jeremy Spierer is a photographer based in Geneva"
statement: "Self-taught, working with Leica cameras and a direct flash, he photographs the body and the city with the same frankness: the naked figure pushed to pure white or swallowed by the night, torn posters, streets and faces met from Kyiv to Bangkok. His work has been exhibited in Geneva, Paris, Tel Aviv and London, and at MAZE Art Gstaad and MAZE Art St. Moritz."
