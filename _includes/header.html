{% assign s = site.data.settings %}{% assign all_series = site.series | sort: 'order' %}
<header class="site-header" data-header>
  <a class="brand" href="{{ '/' | relative_url }}">{{ s.name }}<span class="brand-dot" aria-hidden="true">.</span></a>
  <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-nav-toggle>
    <span class="sr">Menu</span><span class="bars" aria-hidden="true"></span>
  </button>
  <nav id="site-nav" class="site-nav" aria-label="Main">
    <div class="has-sub">
      <a href="{{ '/series/' | relative_url }}" class="{% if page.url contains '/series/' %}is-active{% endif %}">Series</a>
      <ul class="sub">
        {% for x in all_series %}<li><a href="{{ x.url | relative_url }}">{{ x.title }}</a></li>{% endfor %}
      </ul>
    </div>
    <a href="{{ '/exhibitions/' | relative_url }}" class="{% if page.url contains '/exhibitions/' %}is-active{% endif %}">Exhibitions</a>
    <a href="{{ '/prints/' | relative_url }}" class="{% if page.url contains '/prints/' %}is-active{% endif %}">Prints</a>
    <a href="{{ '/about/' | relative_url }}" class="{% if page.url contains '/about/' %}is-active{% endif %}">About</a>
    <a href="{{ '/contact/' | relative_url }}" class="{% if page.url contains '/contact/' %}is-active{% endif %}">Contact</a>
    <a class="ig" href="https://www.instagram.com/{{ s.instagram }}/" rel="noopener" target="_blank" aria-label="Instagram">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor"/></svg>
    </a>
  </nav>
</header>
